name: CI

on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      full_scan:
        description: Also scan the runner's whole system drive (about 10 minutes)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every master commit runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            exe: powershell
          - name: PowerShell 7
            exe: pwsh
    env:
      # The whole-drive scan is slow on a cold runner; one job runs it, on request.
      WINNOW_FULL_SCAN: ${{ inputs.full_scan && matrix.exe == 'pwsh' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the test suite
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1 -Detail

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize -Wrap ScriptName, Line, Severity, RuleName, Message
          if ($results) { throw "PSScriptAnalyzer reported $(@($results).Count) issue(s)." }
          'No issues.'
