name: Release

# A v* tag publishes. A pull request that touches packaging runs the same
# steps up to publishing, so the package is checked before any tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - build/**
      - .github/workflows/release.yml
      - src/Winnow/Winnow.psd1

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish
    needs: test
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write      # the GitHub release
      id-token: write      # signs the build attestation
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:PUBLISH -eq 'true') { $env:GITHUB_REF_NAME } else { '' }
          ./build/Build-Release.ps1 -Tag $tag

      - name: Install from a local feed and check every file
        shell: pwsh
        run: |
          $feed = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'feed')
          $saved = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'saved')
          Register-PSResourceRepository -Name LocalFeed -Uri $feed.FullName -Trusted
          Publish-PSResource -Path out/Winnow -Repository LocalFeed
          Save-PSResource -Name Winnow -Repository LocalFeed -Path $saved.FullName
          $base = (Get-ChildItem (Join-Path $saved.FullName 'Winnow') -Directory)[0].FullName
          $bad = @(Get-Content out/SHA256SUMS.txt | ForEach-Object {
            $hash, $path = $_ -split '  ', 2
            if ((Get-FileHash (Join-Path $base $path)).Hash -ne $hash) { $path }
          })
          if ($bad) { throw "Changed by packaging: $($bad -join ', ')" }
          # A new Windows PowerShell session finds winnow without Import-Module.
          powershell -NoProfile -ExecutionPolicy Bypass -Command "`$env:PSModulePath = '$($saved.FullName);' + `$env:PSModulePath; if (-not (Get-Command winnow -ErrorAction SilentlyContinue)) { exit 1 }; 'rules: ' + @(Get-WinnowRule).Count"
          if ($LASTEXITCODE) { throw 'winnow was not found in the installed module.' }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: out/Winnow-*.zip

      - name: GitHub release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-Item out/Winnow-*.zip).FullName
          gh release create $env:GITHUB_REF_NAME $zip out/SHA256SUMS.txt --verify-tag --title "Winnow $env:GITHUB_REF_NAME" --notes-file out/notes.md
          if ($LASTEXITCODE) { throw 'gh release create failed.' }

      - name: PowerShell Gallery
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'The PSGALLERY_API_KEY secret is not set.' }
          Publish-PSResource -Path out/Winnow -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
